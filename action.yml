name: 'AI TestGen Autonomous Agent'
description: 'Autonomously generates and commits verified unit tests for Python files modified in Pull Requests.'

inputs:
  github_token:
    description: 'GitHub token for pushing code and commenting on PRs'
    required: true
  google_api_key:
    description: 'Gemini API Key for the LangChain integration'
    required: true
  model:
    description: 'The Gemini model to use'
    required: false
    default: 'gemini-3.6-flash'

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # Install the ai_testgen package from the action's repository
        pip install -e ${{ github.action_path }}
        pip install -r ${{ github.action_path }}/requirements.txt
        pip install pytest

    - name: Run Autonomous Agent
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GOOGLE_API_KEY: ${{ inputs.google_api_key }}
        AI_TESTGEN_MODEL: ${{ inputs.model }}
        # The agent relies on GITHUB_EVENT_PATH and GITHUB_REPOSITORY which are automatically injected by Actions
      run: |
        python -m ai_testgen.github_agent
