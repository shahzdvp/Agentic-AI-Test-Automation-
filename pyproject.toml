[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-test-automation"
version = "0.1.0"
description = "AI-Powered Test Automation Framework"
requires-python = ">=3.10"
dependencies = [
    "langchain-google-genai>=2.0.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer[all]>=0.12",
    "loguru>=0.7",
    "pytest>=8.0",
    "PyGithub>=2.3.0"
]

[project.scripts]
ai-testgen = "ai_testgen.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "examples"]
markers = [
    "smoke",
    "integration",
    "ai_generated"
]
addopts = "-ra -q --strict-markers --tb=short"

[tool.coverage.run]
source = ["src/ai_testgen"]

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
